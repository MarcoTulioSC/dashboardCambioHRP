<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acompanhamento Cambial BNA - Angola - 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Ocupa exatamente 100% da altura da janela sem scroll externo */
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

   header {
      text-align: center;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

   header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff !important; /* Força o branco no título */
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    header p {
      margin-top: 4px;
      font-size: 0.95rem;
      color: #ffffff !important; /* Força o branco no subtítulo */
      opacity: 0.9;
    }

    /* O container ocupa todo o espaço restante da tela */
    .dashboard-container {
      width: 100%;
      max-width: 1600px; /* Expandido para telas maiores */
      flex: 1; /* Ocupa a altura vertical disponível */
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      position: relative;
    }

    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Tela de carregamento */
    .loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-logo {
      width: 180px;
      max-width: 60%;
      margin-bottom: 28px;
      opacity: 0.95;
    }

    .loading-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 18px;
    }

    .loading-icon svg {
      width: 100%;
      height: 100%;
    }

    .chart-line {
      stroke-dasharray: 120;
      stroke-dashoffset: 120;
      animation: drawLine 1.8s ease-in-out infinite;
    }

    @keyframes drawLine {
      0% { stroke-dashoffset: 120; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }

    .coin-pulse {
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.12); opacity: 0.7; }
    }

    .loading-text {
      color: #2c5364;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .loading-dots span {
      animation: blink 1.4s infinite;
      animation-fill-mode: both;
    }

    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }

    footer {
      margin-top: 8px;
      color: #ffffff !important; /* Deixa o texto do rodapé visível */
      font-size: 0.85rem;
      text-align: center;
      flex-shrink: 0;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <h1>📊 Acompanhamento Cambial BNA - Angola</h1>
    <p>Painel interativo — clique, filtre e explore os dados para análise mais detalhada.</p>
  </header>

  <div class="dashboard-container">
    <div class="iframe-wrapper">

      <div class="loading-screen" id="loadingScreen">
        <img
          class="loading-logo"
          src="https://hrpservicos.com.br/_astro/hrp-logo.0LBAsylc_Z2e68Xe.svg"
          alt="HRP Serviços"
        />
        
        <div class="loading-icon coin-pulse">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" stroke="#2c5364" stroke-width="3"/>
            <path class="chart-line" d="M14 38 L24 28 L32 34 L42 20 L50 26"
                  stroke="#2c5364" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M42 20 L50 20 L50 28" stroke="#2c5364" stroke-width="3"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <div class="loading-text">
          Carregando dashboard<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
      </div>

      <iframe
  id="dashboardFrame"
  title="TaxaCambial"
  src="https://app.powerbi.com/view?r=eyJrIjoiN2QzZWI3N2YtMWI3Ny00MmZlLTkwYzQtYjRiMzI1MDUxMzhjIiwidCI6IjAzZmZkMTBlLTIyY2YtNDFlNS1iNmZlLWMxOWFkMjllYjYxNSJ9&language=pt-BR"
  allowFullScreen="true">
</iframe>

    </div>
  </div>

  <footer>
    Dados atualizados diariamente pelo banco BNA | v1.0.0.2 Marco Tulio
  </footer>

  <script>
    const iframe = document.getElementById('dashboardFrame');
    const loadingScreen = document.getElementById('loadingScreen');

    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        loadingScreen.classList.add('hidden');
        if (iframe) {
          iframe.classList.add('loaded');
        }
      }, 3000);
    });
  </script>

</body>
</html>
